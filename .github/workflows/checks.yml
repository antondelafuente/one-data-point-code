name: Offline release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/figures/requirements.txt
      - name: Install CPU plotting packages
        run: python -m pip install -r code/figures/requirements.txt
      - name: Compile released Python
        run: python -m compileall -q code tests tools
      - name: Run offline tests and reproduce figures
        env:
          ODP_TEST_FIGURES: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m unittest discover -s tests -v
